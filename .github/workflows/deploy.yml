name: Deploy to Yandex Object Storage

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html && echo "index.html exists" || (echo "index.html missing" && exit 1)
          find dist -maxdepth 2 -type f | sort

      - name: Check secrets presence
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_KEY }}
          YC_BUCKET: ${{ secrets.YC_BUCKET }}
          YC_ENDPOINT: ${{ secrets.YC_ENDPOINT }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID" && echo "AWS_ACCESS_KEY_ID exists" || (echo "AWS_ACCESS_KEY_ID missing" && exit 1)
          test -n "$AWS_SECRET_ACCESS_KEY" && echo "AWS_SECRET_ACCESS_KEY exists" || (echo "AWS_SECRET_ACCESS_KEY missing" && exit 1)
          test -n "$YC_BUCKET" && echo "YC_BUCKET exists" || (echo "YC_BUCKET missing" && exit 1)
          test -n "$YC_ENDPOINT" && echo "YC_ENDPOINT exists" || (echo "YC_ENDPOINT missing" && exit 1)

      - name: Install AWS CLI
        run: |
          python -m pip install --upgrade pip
          pip install awscli

      - name: Deploy to Yandex Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_KEY }}
          YC_BUCKET: ${{ secrets.YC_BUCKET }}
          YC_ENDPOINT: ${{ secrets.YC_ENDPOINT }}
        run: |
          set -euo pipefail
          echo "Deploying to bucket: $YC_BUCKET"
          aws --version
          aws s3 sync dist/ s3://$YC_BUCKET --delete --endpoint-url "$YC_ENDPOINT"

      - name: List bucket root after deploy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_KEY }}
          YC_BUCKET: ${{ secrets.YC_BUCKET }}
          YC_ENDPOINT: ${{ secrets.YC_ENDPOINT }}
        run: |
          aws s3 ls s3://$YC_BUCKET --endpoint-url "$YC_ENDPOINT"
