name: Deploy to Yandex Object Storage

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html && echo "index.html exists" || (echo "index.html missing" && exit 1)
          find dist -maxdepth 2 -type f | sort

      - name: Ensure AWS CLI v2
        run: |
          set -euo pipefail
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          aws --version

      - name: Configure AWS CLI for Yandex Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.aws

          cat > ~/.aws/credentials << EOF
          [default]
          aws_access_key_id=$AWS_ACCESS_KEY_ID
          aws_secret_access_key=$AWS_SECRET_ACCESS_KEY
          EOF

          cat > ~/.aws/config << EOF
          [default]
          region = ru-central1
          s3 =
            addressing_style = path
          EOF

          aws configure list

      - name: Deploy to Yandex Object Storage
        env:
          BUCKET: ${{ secrets.YC_BUCKET }}
          ENDPOINT: ${{ secrets.YC_ENDPOINT }}
          AWS_REGION: ru-central1
          AWS_DEFAULT_REGION: ru-central1
          AWS_DEFAULTS_MODE: legacy
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set -euo pipefail

          echo "Deploying to bucket: $BUCKET"
          echo "Using endpoint: $ENDPOINT"
          aws --version

          aws s3 sync dist/ s3://$BUCKET \
            --delete \
            --endpoint-url "$ENDPOINT" \
            --region ru-central1

      - name: List bucket root after deploy
        env:
          BUCKET: ${{ secrets.YC_BUCKET }}
          ENDPOINT: ${{ secrets.YC_ENDPOINT }}
        run: |
          aws s3 ls s3://$BUCKET --endpoint-url "$ENDPOINT"
